<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Radio — Opening Sequence Concept</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; }
  canvas { display: block; }
  #info {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.2); font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; font-weight: 300; pointer-events: none;
    transition: opacity 2s ease;
  }
  #phase-label {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.15); font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; font-weight: 300; pointer-events: none;
    transition: opacity 1s ease;
  }
</style>
</head>
<body>
<div id="info">AI RADIO · OPENING SEQUENCE</div>
<div id="phase-label">VOID</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============= SCENE SETUP =============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.z = 12;
camera.position.y = 0.3;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// ============= LIGHT POINT =============
const coreGeo = new THREE.SphereGeometry(0.08, 16, 16);
const coreMat = new THREE.MeshBasicMaterial({ color: 0x88bbff });
const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

// Glow aura around core
const glowGeo = new THREE.SphereGeometry(0.3, 24, 24);
const glowMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uColor: { value: new THREE.Color(0x4488ff) },
    uIntensity: { value: 0.8 }
  },
  vertexShader: `
    varying vec3 vPosition;
    void main() {
      vPosition = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    uniform float uIntensity;
    varying vec3 vPosition;
    void main() {
      float d = length(vPosition) / 0.3;
      float alpha = exp(-d * 4.0) * uIntensity;
      gl_FragColor = vec4(uColor, alpha * 0.6);
    }
  `
});
const glow = new THREE.Mesh(glowGeo, glowMat);
scene.add(glow);

// ============= PARTICLE SYSTEM =============
const PARTICLE_COUNT = 3000;
const particles = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const sizes = new Float32Array(PARTICLE_COUNT);
const velocities = new Float32Array(PARTICLE_COUNT * 3);
const origins = new Float32Array(PARTICLE_COUNT * 3);
const phases = new Uint8Array(PARTICLE_COUNT); // 0=inactive, 1=ring, 2=bloom, 3=settle
const phaseProgress = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0;
  sizes[i] = 0.01 + Math.random() * 0.03;
  velocities[i*3] = 0; velocities[i*3+1] = 0; velocities[i*3+2] = 0;
  
  // Spawn positions on a sphere
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 0.5 + Math.random() * 3.5;
  origins[i*3] = r * Math.sin(phi) * Math.cos(theta);
  origins[i*3+1] = r * Math.cos(phi) * 0.3;
  origins[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
  
  phases[i] = 0;
  phaseProgress[i] = 0;
}

particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particles.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const particleMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uColor: { value: new THREE.Color(0x6699ff) },
    uTime: { value: 0 }
  },
  vertexShader: `
    attribute float size;
    uniform float uTime;
    varying float vAlpha;
    void main() {
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * 300.0 / -mvPos.z;
      gl_Position = projectionMatrix * mvPos;
      float d = length(position);
      vAlpha = exp(-d * 0.8) * 0.8;
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - vec2(0.5));
      if (d > 0.5) discard;
      float alpha = smoothstep(0.5, 0.0, d) * vAlpha;
      gl_FragColor = vec4(uColor, alpha * 0.5);
    }
  `
});
const particleSystem = new THREE.Points(particles, particleMat);
scene.add(particleSystem);

// ============= BLOOM FLASH =============
const flashGeo = new THREE.PlaneGeometry(20, 20);
const flashMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uIntensity: { value: 0 }
  },
  vertexShader: `void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uIntensity;
    void main() {
      float alpha = uIntensity * 0.6;
      gl_FragColor = vec4(0.4, 0.6, 1.0, alpha * alpha);
    }
  `
});
const flash = new THREE.Mesh(flashGeo, flashMat);
flash.position.z = -1;
scene.add(flash);

// ============= FLOATING UI ELEMENTS CONCEPT =============
const uiGroup = new THREE.Group();
scene.add(uiGroup);

// Create abstract UI shapes
for (let i = 0; i < 8; i++) {
  const w = 0.8 + Math.random() * 2.0;
  const h = 0.05 + Math.random() * 0.6;
  const geo = new THREE.PlaneGeometry(w, h);
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uOpacity: { value: 0 } },
    vertexShader: `void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float uOpacity;
      void main() {
        float alpha = 0.15 * uOpacity;
        gl_FragColor = vec4(0.5, 0.7, 1.0, alpha);
      }
    `
  });
  const mesh = new THREE.Mesh(geo, mat);
  const angle = (i / 8) * Math.PI * 2;
  const radius = 2.8 + Math.random() * 1.2;
  mesh.position.set(
    Math.cos(angle) * radius,
    (Math.random() - 0.5) * 2.5 + Math.sin(angle) * 0.5,
    Math.sin(angle) * radius * 0.3 - 2
  );
  mesh.rotation.z = (Math.random() - 0.5) * 0.3;
  mesh.userData = { angle: angle, radius: radius, speed: 0.1 + Math.random() * 0.2, mat: mat };
  uiGroup.add(mesh);
}

// Add "now playing" bar concept
const barGeo = new THREE.PlaneGeometry(3.0, 0.06);
const barMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uOpacity: { value: 0 }, uProgress: { value: 0 } },
  vertexShader: `void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uOpacity; uniform float uProgress;
    void main() {
      vec2 uv = gl_PointCoord;
      float fill = step(gl_FragCoord.x / 1920.0 * 3.0, uProgress);
      vec3 col = mix(vec3(0.3, 0.6, 1.0), vec3(1.0, 1.0, 1.0), fill);
      gl_FragColor = vec4(col, 0.3 * uOpacity);
    }
  `
});
const bar = new THREE.Mesh(barGeo, barMat);
bar.position.set(0, -2.0, -3);
scene.add(bar);

// ============= SEQUENCE STATE MACHINE =============
const STATE = { VOID: 0, PULSE_1: 1, PULSE_2: 2, PULSE_3: 3, BLOOM: 4, REVEAL: 5, COMPLETE: 6 };
let state = STATE.VOID;
let stateTime = 0;
let totalTime = 0;
let pulsePhase = 0;

// Ring particles manager
let nextRingParticle = 0;
const RING_COUNT = 80;

function spawnRingParticles(intensity) {
  for (let i = 0; i < Math.floor(40 * intensity); i++) {
    if (nextRingParticle >= PARTICLE_COUNT) nextRingParticle = 0;
    const idx = nextRingParticle;
    
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 0.6 + Math.random() * 0.8;
    
    origins[idx*3] = r * Math.sin(phi) * Math.cos(theta);
    origins[idx*3+1] = r * Math.cos(phi) * 0.2;
    origins[idx*3+2] = r * Math.sin(phi) * Math.sin(theta);
    
    positions[idx*3] = 0;
    positions[idx*3+1] = 0;
    positions[idx*3+2] = 0;
    
    const speed = 0.4 + Math.random() * 0.8;
    const dir = new THREE.Vector3(origins[idx*3], origins[idx*3+1], origins[idx*3+2]).normalize();
    velocities[idx*3] = dir.x * speed;
    velocities[idx*3+1] = dir.y * speed;
    velocities[idx*3+2] = dir.z * speed;
    
    phases[idx] = 1;
    phaseProgress[idx] = 0;
    
    nextRingParticle++;
  }
}

function spawnBloomParticles() {
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    if (Math.random() > 0.5) continue;
    
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 3 + Math.random() * 6;
    
    origins[i*3] = r * Math.sin(phi) * Math.cos(theta);
    origins[i*3+1] = r * Math.cos(phi) * 0.4;
    origins[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    
    positions[i*3] = 0;
    positions[i*3+1] = 0;
    positions[i*3+2] = 0;
    
    const dir = new THREE.Vector3(origins[i*3], origins[i*3+1], origins[i*3+2]).normalize();
    const speed = 1.2 + Math.random() * 2.0;
    velocities[i*3] = dir.x * speed;
    velocities[i*3+1] = dir.y * speed;
    velocities[i*3+2] = dir.z * speed;
    
    phases[i] = 2;
    phaseProgress[i] = 0;
  }
}

// ============= UPDATE =============
const $label = document.getElementById('phase-label');
const $info = document.getElementById('info');

function update(delta) {
  totalTime += delta;
  stateTime += delta;
  
  // Phase labels
  const labels = ['VOID', 'PULSE 1', 'PULSE 2', 'PULSE 3', 'BLOOM', 'REVEAL', '· ON AIR ·'];
  $label.textContent = labels[state];
  
  // === STATE MACHINE ===
  switch(state) {
    case STATE.VOID: {
      if (stateTime > 1.0) {
        state = STATE.PULSE_1;
        stateTime = 0;
        spawnRingParticles(1.0);
      }
      
      // Subtle breathing of the core before first pulse
      const breathe = 1 + Math.sin(totalTime * 2) * 0.1;
      core.scale.setScalar(breathe);
      glow.scale.setScalar(breathe * 1.2);
      glowMat.uniforms.uIntensity.value = 0.3 + Math.sin(totalTime * 2) * 0.1;
      break;
    }
    
    case STATE.PULSE_1:
    case STATE.PULSE_2:
    case STATE.PULSE_3: {
      const pulseDuration = 1.0;
      const t = stateTime / pulseDuration;
      
      // Core pulses
      const pulse = 1 + Math.sin(t * Math.PI) * 0.6;
      core.scale.setScalar(pulse);
      glow.scale.setScalar(pulse * 1.5);
      glowMat.uniforms.uIntensity.value = 0.4 + Math.sin(t * Math.PI) * 0.6;
      
      // Color shifts slightly warmer with each pulse
      const hueShift = state === STATE.PULSE_1 ? 0 : state === STATE.PULSE_2 ? 0.05 : 0.1;
      const r = 0.3 + hueShift;
      const g = 0.5 + hueShift * 0.3;
      const b = 1.0;
      glowMat.uniforms.uColor.value.setRGB(r, g, b);
      particleMat.uniforms.uColor.value.setRGB(r, g, b);
      
      if (stateTime > 0.3 && stateTime < 0.35) {
        spawnRingParticles(1.0 + state * 0.3);
      }
      
      if (t >= 1.0) {
        if (state === STATE.PULSE_3) {
          state = STATE.BLOOM;
          stateTime = 0;
          spawnBloomParticles();
        } else {
          state++;
          stateTime = 0;
        }
      }
      break;
    }
    
    case STATE.BLOOM: {
      const t = stateTime / 1.8;
      
      // Flash intensity
      flashMat.uniforms.uIntensity.value = Math.sin(t * Math.PI) * 1.5;
      
      // Core expands
      const expansion = 1 + t * 8;
      core.scale.setScalar(Math.max(0.1, expansion));
      glow.scale.setScalar(expansion * 1.2);
      glowMat.uniforms.uIntensity.value = Math.max(0, 1.5 * (1 - t));
      
      // Camera subtly pushes in
      camera.position.z = 12 - t * 1.5;
      
      if (t >= 1.0) {
        state = STATE.REVEAL;
        stateTime = 0;
        flashMat.uniforms.uIntensity.value = 0;
      }
      break;
    }
    
    case STATE.REVEAL: {
      const t = stateTime / 3.0;
      
      // UI elements fade in
      uiGroup.children.forEach((mesh, i) => {
        const delay = i * 0.15;
        const localT = Math.max(0, Math.min(1, (t - delay) / 0.8));
        const eased = 1 - Math.pow(1 - localT, 3);
        mesh.userData.mat.uniforms.uOpacity.value = eased;
      });
      
      // Progress bar
      barMat.uniforms.uOpacity.value = Math.max(0, Math.min(1, (t - 1.5) / 0.8));
      barMat.uniforms.uProgress.value = Math.min(1, (t - 1.5) / 1.5);
      
      // Particles settle into ambient state
      const posAttr = particleSystem.geometry.attributes.position;
      const pArray = posAttr.array;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        if (phases[i] >= 2) {
          phaseProgress[i] = Math.min(1, phaseProgress[i] + delta * 0.5);
          const easeOut = 1 - Math.pow(1 - phaseProgress[i], 2);
          
          // Settle into ambient drift positions
          const angle = Math.random() * Math.PI * 2;
          const driftR = 2 + Math.random() * 4;
          const targetX = Math.cos(angle + totalTime * 0.02 * (i % 100) * 0.1) * driftR;
          const targetY = Math.sin(angle * 0.5 + totalTime * 0.01) * 1.5;
          const targetZ = Math.sin(angle + totalTime * 0.015) * driftR * 0.3 - 2;
          
          pArray[i*3] += (targetX - pArray[i*3]) * delta * 0.3;
          pArray[i*3+1] += (targetY - pArray[i*3+1]) * delta * 0.3;
          pArray[i*3+2] += (targetZ - pArray[i*3+2]) * delta * 0.3;
        }
      }
      posAttr.needsUpdate = true;
      
      // Ambient glow returns
      glowMat.uniforms.uIntensity.value = 0.25 + Math.sin(totalTime * 0.5) * 0.1;
      core.scale.setScalar(1 + Math.sin(totalTime * 0.8) * 0.05);
      
      // Fade info text
      $info.style.opacity = Math.max(0, 1 - t * 1.5);
      
      if (t >= 1.0) {
        state = STATE.COMPLETE;
        stateTime = 0;
      }
      break;
    }
    
    case STATE.COMPLETE: {
      // Ambient state - gentle drift forever
      glowMat.uniforms.uIntensity.value = 0.2 + Math.sin(totalTime * 0.3) * 0.1;
      core.scale.setScalar(0.8 + Math.sin(totalTime * 0.5) * 0.1);
      
      // UI floats gently
      uiGroup.children.forEach((mesh, i) => {
        const floatY = Math.sin(totalTime * 0.2 + i * 0.5) * 0.1;
        mesh.position.y += floatY * 0.001;
        mesh.userData.mat.uniforms.uOpacity.value = 0.12 + Math.sin(totalTime * 0.1 + i) * 0.03;
      });
      
      $label.style.opacity = 0.6;
      break;
    }
  }
  
  // === CONTINUOUS PARTICLE UPDATE ===
  const posAttr = particleSystem.geometry.attributes.position;
  const pArray = posAttr.array;
  
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    if (phases[i] === 1) {
      // Ring particles expanding
      phaseProgress[i] += delta * 0.5;
      if (phaseProgress[i] < 1) {
        const easeOut = 1 - Math.pow(1 - phaseProgress[i], 2);
        pArray[i*3] = origins[i*3] * easeOut;
        pArray[i*3+1] = origins[i*3+1] * easeOut;
        pArray[i*3+2] = origins[i*3+2] * easeOut;
      } else {
        // Fade out
        const fade = Math.max(0, 1 - (phaseProgress[i] - 1) * 1.0);
        const targetX = origins[i*3] * 3;
        const targetY = origins[i*3+1] * 3;
        const targetZ = origins[i*3+2] * 3;
        pArray[i*3] += (targetX - pArray[i*3]) * delta * 0.2;
        pArray[i*3+1] += (targetY - pArray[i*3+1]) * delta * 0.2;
        pArray[i*3+2] += (targetZ - pArray[i*3+2]) * delta * 0.2;
      }
    }
    else if (phases[i] === 2) {
      // Bloom particles expanding
      phaseProgress[i] += delta * 0.8;
      if (phaseProgress[i] < 1) {
        const easeOut = 1 - Math.pow(1 - phaseProgress[i], 3);
        pArray[i*3] = origins[i*3] * easeOut;
        pArray[i*3+1] = origins[i*3+1] * easeOut;
        pArray[i*3+2] = origins[i*3+2] * easeOut;
      }
    }
  }
  posAttr.needsUpdate = true;
  
  // Particle color shift
  particleMat.uniforms.uTime.value = totalTime;
  
  // Glow rotates slowly
  glow.rotation.x += delta * 0.1;
  glow.rotation.y += delta * 0.05;
}

// ============= ANIMATION LOOP =============
let lastTime = 0;

function animate(time) {
  const delta = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;
  
  update(delta);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// ============= RESIZE =============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============= START =============
animate(0);

// Reload button
setTimeout(() => {
  const btn = document.createElement('button');
  btn.textContent = '↻ REPLAY';
  btn.style.cssText = `
    position: fixed; bottom: 30px; right: 30px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.3); padding: 8px 20px; border-radius: 20px;
    cursor: pointer; font-size: 11px; letter-spacing: 1px; font-family: inherit;
    transition: all 0.3s; z-index: 100;
  `;
  btn.onmouseover = () => { btn.style.background = 'rgba(255,255,255,0.1)'; btn.style.color = 'rgba(255,255,255,0.6)'; };
  btn.onmouseout = () => { btn.style.background = 'rgba(255,255,255,0.05)'; btn.style.color = 'rgba(255,255,255,0.3)'; };
  btn.onclick = () => { location.reload(); };
  document.body.appendChild(btn);
}, 500);
</script>
</body>
</html>
