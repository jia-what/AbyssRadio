<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abyss Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <rect width="400" height="600" fill="#000000"/>

  <!-- 横线（位于 V 两侧外部，不穿进 V 内部） -->
  <line x1="95" y1="200" x2="158" y2="200" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="245" y1="200" x2="308" y2="200" stroke="white" stroke-width="2" opacity="0.7"/>

  <!-- V 的两笔 — 更短更胖，顶部开口更宽 -->
  <path d="M 130 140 L 200 280" stroke="white" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M 270 140 L 200 280" stroke="white" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- ABYSS — 靠近符号 -->
  <text x="206" y="380" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="white" text-anchor="middle" letter-spacing="14">ABYSS</text>
</svg>
</body>
</html>
